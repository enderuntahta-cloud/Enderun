<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2 Kişilik Penaltı Oyunu - Stadyum</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 95vh;
            max-height: 800px;
            background: #1b5e20;
            border: 4px solid #fff;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        /* Skor ve Bilgi Paneli */
        #score-board {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            z-index: 5;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .player-score {
            text-align: center;
        }

        .score-val {
            font-size: 22px;
            color: #facc15;
            font-weight: 800;
        }

        #turn-info {
            text-align: center;
            background: #1e293b;
            padding: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #4ade80;
            letter-spacing: 0.5px;
        }

        /* Oyun Sahası Canvas */
        canvas {
            flex: 1;
            width: 100%;
            display: block;
        }

        /* Ekran Üstü Mesajlar & Modallar */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .overlay h1 {
            font-size: 30px;
            margin-bottom: 15px;
            color: #facc15;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .overlay p {
            font-size: 16px;
            color: #cbd5e1;
        }

        .overlay input {
            width: 90px;
            padding: 10px;
            font-size: 22px;
            text-align: center;
            border-radius: 8px;
            border: 2px solid #475569;
            margin: 15px 0 25px 0;
            background: #0f172a;
            color: #fff;
            font-weight: bold;
        }

        .overlay button {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            background: #22c55e;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }

        .overlay button:active {
            transform: scale(0.96);
            background: #16a34a;
        }

        /* Gol / Kazma Açılır Pop-up */
        #result-popup {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 46px;
            font-weight: 900;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 8;
            letter-spacing: 2px;
        }

        #result-popup.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .afferin { color: #4ade80; }
        .kazma { color: #ef4444; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Başlangıç Ayar Ekranı -->
    <div id="start-modal" class="overlay">
        <h1>⚽ PENALTISPOR</h1>
        <p>Hedef Skor Kaç Olsun?</p>
        <input type="number" id="target-score-input" value="3" min="1" max="20">
        <button id="start-btn">BAŞLA</button>
    </div>

    <!-- Oyun Bitiş Ekranı -->
    <div id="gameover-modal" class="overlay" style="display: none;">
        <h1 id="winner-text">OYUN BİTTİ</h1>
        <button id="restart-btn">YENİDEN OYNA</button>
    </div>

    <!-- Skor Tabelası -->
    <div id="score-board">
        <div class="player-score">
            <div>1. OYUNCU</div>
            <div id="p1-score" class="score-val">0</div>
        </div>
        <div style="text-align: center;">
            <div style="font-size: 11px; color: #94a3b8;">HEDEF</div>
            <div id="target-score-disp" style="font-size: 18px; color: #fff;">3</div>
        </div>
        <div class="player-score">
            <div>2. OYUNCU</div>
            <div id="p2-score" class="score-val">0</div>
        </div>
    </div>

    <div id="turn-info">1. Oyuncu Çiziyor!</div>

    <!-- Saha ve Oyun Çizim Alanı -->
    <canvas id="gameCanvas"></canvas>

    <!-- Sonuç Yazısı (AFFERİN / KAZMA) -->
    <div id="result-popup"></div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Modallar ve Arayüz
    const startModal = document.getElementById('start-modal');
    const gameoverModal = document.getElementById('gameover-modal');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const targetInput = document.getElementById('target-score-input');
    const targetDisp = document.getElementById('target-score-disp');
    const p1ScoreElem = document.getElementById('p1-score');
    const p2ScoreElem = document.getElementById('p2-score');
    const turnInfo = document.getElementById('turn-info');
    const resultPopup = document.getElementById('result-popup');

    // Oyun Durum Değişkenleri
    let targetScore = 3;
    let p1Score = 0;
    let p2Score = 0;
    let currentShooter = 1; 
    let gameState = 'AIMING'; // 'AIMING', 'SHOOTING', 'WAITING'
    
    let path = []; 
    let isDrawing = false;
    let pathIndex = 0;

    function resizeCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }
    resizeCanvas();

    // Oyun Elemanları
    const goal = {
        x: 0,
        y: 75,
        width: 0,
        height: 30
    };

    const keeper = {
        x: 0,
        y: 0,
        width: 44,
        height: 52,
        speed: 3.5,
        dir: 1
    };

    const ball = {
        x: 0,
        y: 0,
        radius: 11,
        startX: 0,
        startY: 0
    };

    function initPositions() {
        goal.width = canvas.width * 0.65;
        goal.x = (canvas.width - goal.width) / 2;

        keeper.x = canvas.width / 2 - keeper.width / 2;
        keeper.y = goal.y + goal.height - 10;
        keeper.speed = 3 + Math.random() * 1.5;

        ball.x = canvas.width / 2;
        ball.y = canvas.height - 70;
        ball.startX = ball.x;
        ball.startY = ball.y;

        path = [];
        pathIndex = 0;
    }

    startBtn.addEventListener('click', () => {
        targetScore = parseInt(targetInput.value) || 3;
        targetDisp.textContent = targetScore;
        p1Score = 0;
        p2Score = 0;
        currentShooter = 1;
        updateScoreBoard();
        startModal.style.display = 'none';
        initPositions();
        setTurnText();
        requestAnimationFrame(gameLoop);
    });

    restartBtn.addEventListener('click', () => {
        gameoverModal.style.display = 'none';
        startModal.style.display = 'flex';
    });

    function setTurnText() {
        turnInfo.textContent = `${currentShooter}. Oyuncu Topu Çiziyor!`;
    }

    function updateScoreBoard() {
        p1ScoreElem.textContent = p1Score;
        p2ScoreElem.textContent = p2Score;
    }

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function startDraw(e) {
        if (gameState !== 'AIMING') return;
        const pos = getPos(e);
        const dist = Math.hypot(pos.x - ball.x, pos.y - ball.y);
        if (dist < 45) {
            isDrawing = true;
            path = [{x: ball.x, y: ball.y}];
        }
    }

    function moveDraw(e) {
        if (!isDrawing || gameState !== 'AIMING') return;
        const pos = getPos(e);
        const lastPoint = path[path.length - 1];
        if (pos.y < lastPoint.y) {
            path.push(pos);
        }
    }

    function endDraw() {
        if (!isDrawing) return;
        isDrawing = false;
        if (path.length > 5) {
            gameState = 'SHOOTING';
            turnInfo.textContent = "Şut Çekildi!";
        } else {
            path = [];
        }
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);

    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', moveDraw);
    window.addEventListener('touchend', endDraw);

    // Otomatik Sağa-Sola Kaleci Hareketi
    function updateKeeper() {
        keeper.x += keeper.speed * keeper.dir;
        const minX = goal.x + 5;
        const maxX = goal.x + goal.width - keeper.width - 5;

        if (keeper.x >= maxX) {
            keeper.x = maxX;
            keeper.dir = -1;
        } else if (keeper.x <= minX) {
            keeper.x = minX;
            keeper.dir = 1;
        }
    }

    function update() {
        updateKeeper();

        if (gameState === 'SHOOTING') {
            if (pathIndex < path.length) {
                pathIndex += 4; 
                const currentPoint = path[Math.min(pathIndex, path.length - 1)];
                ball.x = currentPoint.x;
                ball.y = currentPoint.y;

                // Kaleci Çarpışma (İnsan karakter kutusu)
                if (
                    ball.x + ball.radius > keeper.x &&
                    ball.x - ball.radius < keeper.x + keeper.width &&
                    ball.y + ball.radius > keeper.y &&
                    ball.y - ball.radius < keeper.y + keeper.height
                ) {
                    showResult(false);
                    return;
                }

                // Gol Çizgisi Kontrolü
                if (ball.y <= goal.y + goal.height) {
                    if (ball.x >= goal.x && ball.x <= goal.x + goal.width) {
                        showResult(true);
                    } else {
                        showResult(false);
                    }
                    return;
                }
            } else {
                showResult(false);
            }
        }
    }

    function showResult(isGoal) {
        gameState = 'WAITING';

        if (isGoal) {
            resultPopup.textContent = "AFFERİN!";
            resultPopup.className = "show afferin";
            if (currentShooter === 1) p1Score++;
            else p2Score++;
        } else {
            resultPopup.textContent = "KAZMA!";
            resultPopup.className = "show kazma";
        }

        updateScoreBoard();

        setTimeout(() => {
            resultPopup.className = "";
            checkWinner();
        }, 1500);
    }

    function checkWinner() {
        if (p1Score >= targetScore || p2Score >= targetScore) {
            const winner = p1Score >= targetScore ? "1. OYUNCU" : "2. OYUNCU";
            document.getElementById('winner-text').textContent = `TEBRİKLER! ${winner} KAZANDI!`;
            gameoverModal.style.display = 'flex';
        } else {
            currentShooter = currentShooter === 1 ? 2 : 1;
            initPositions();
            setTurnText();
            gameState = 'AIMING';
        }
    }

    // STADYUM ÇİZİMİ
    function drawStadium() {
        // Tribünler
        const grad = ctx.createLinearGradient(0, 0, 0, goal.y);
        grad.addColorStop(0, '#0f172a');
        grad.addColorStop(0.7, '#1e293b');
        grad.addColorStop(1, '#334155');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, goal.y);

        // Seyirciler / Tribün Işıkları
        for (let i = 0; i < 50; i++) {
            const rx = (i * 37) % canvas.width;
            const ry = (i * 13) % (goal.y - 15);
            ctx.fillStyle = (i % 3 === 0) ? 'rgba(255,255,255,0.7)' : ((i % 2 === 0) ? 'rgba(239, 68, 68, 0.5)' : 'rgba(59, 130, 246, 0.5)');
            ctx.fillRect(rx, ry, 3, 3);
        }

        // Çim Saha (Şeritli)
        const stripeHeight = 35;
        for (let y = goal.y; y < canvas.height; y += stripeHeight) {
            ctx.fillStyle = Math.floor((y - goal.y) / stripeHeight) % 2 === 0 ? '#1b5e20' : '#2e7d32';
            ctx.fillRect(0, y, canvas.width, stripeHeight);
        }

        // Ceza Sahası Çizgileri
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 3;

        const boxWidth = goal.width + 70;
        const boxHeight = canvas.height * 0.42;
        const boxX = (canvas.width - boxWidth) / 2;
        ctx.strokeRect(boxX, goal.y + goal.height, boxWidth, boxHeight);

        // Kale Filesi
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 1;
        
        for (let x = goal.x; x <= goal.x + goal.width; x += 8) {
            ctx.beginPath(); ctx.moveTo(x, goal.y); ctx.lineTo(x, goal.y + goal.height); ctx.stroke();
        }
        for (let y = goal.y; y <= goal.y + goal.height; y += 8) {
            ctx.beginPath(); ctx.moveTo(goal.x, y); ctx.lineTo(goal.x + goal.width, y); ctx.stroke();
        }

        // Kale Direkleri
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.strokeRect(goal.x, goal.y, goal.width, goal.height);

        // Penaltı Noktası
        ctx.beginPath();
        ctx.arc(canvas.width / 2, ball.startY, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
    }

    // İNSAN KALECİ ÇİZİMİ
    function drawHumanKeeper(x, y, width, height) {
        ctx.save();
        const centerX = x + width / 2;

        // Kafa
        ctx.fillStyle = '#ffcc99'; 
        ctx.beginPath();
        ctx.arc(centerX, y + 8, 7, 0, Math.PI * 2);
        ctx.fill();

        // Saç / Şapka
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(centerX, y + 7, 7, Math.PI, 0);
        ctx.fill();

        // Gövde (Forma)
        ctx.fillStyle = '#ff9800'; 
        ctx.fillRect(centerX - 10, y + 15, 20, 18);

        // Kollar (Açık Bekleme Pozisyonu)
        ctx.strokeStyle = '#ff9800';
        ctx.lineWidth = 5;
        ctx.beginPath();
        // Sol Kol
        ctx.moveTo(centerX - 8, y + 17);
        ctx.lineTo(centerX - 20, y + 25);
        // Sağ Kol
        ctx.moveTo(centerX + 8, y + 17);
        ctx.lineTo(centerX + 20, y + 25);
        ctx.stroke();

        // Eldivenler
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(centerX - 21, y + 26, 4.5, 0, Math.PI * 2);
        ctx.arc(centerX + 21, y + 26, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // Şort
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(centerX - 10, y + 33, 20, 9);

        // Bacaklar
        ctx.fillStyle = '#ffcc99';
        ctx.fillRect(centerX - 8, y + 42, 6, 8);
        ctx.fillRect(centerX + 2, y + 42, 6, 8);

        // Kramponlar
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(centerX - 9, y + 48, 7, 4);
        ctx.fillRect(centerX + 2, y + 48, 7, 4);

        ctx.restore();
    }

    // TOP ÇİZİMİ (Futbol Topu Deseni)
    function drawBall(x, y, r) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#000000';
        ctx.stroke();

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(x, y, r * 0.35, 0, Math.PI * 2);
        ctx.fill();

        for (let i = 0; i < 5; i++) {
            const angle = (i * Math.PI * 2) / 5;
            const px = x + Math.cos(angle) * (r * 0.65);
            const py = y + Math.sin(angle) * (r * 0.65);
            ctx.beginPath();
            ctx.arc(px, py, r * 0.18, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Stadyum ve Sahayı Çiz
        drawStadium();

        // Çizilen Top Yolu
        if (path.length > 0) {
            ctx.beginPath();
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 6]);
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Kaleciyi Çiz
        drawHumanKeeper(keeper.x, keeper.y, keeper.width, keeper.height);

        // Topu Çiz
        drawBall(ball.x, ball.y, ball.radius);
    }

    function gameLoop() {
        if (gameState !== 'WAITING') {
            update();
        }
        draw();
        requestAnimationFrame(gameLoop);
    }

    window.addEventListener('resize', () => {
        resizeCanvas();
        initPositions();
    });
</script>
</body>
</html>
